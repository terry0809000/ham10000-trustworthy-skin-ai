project_name: ham10000_trustworthy_skin_ai
seed: 42
image_size: 224
batch_size: 8
backbone: ResNet50
loss_type: weighted_ce
use_metadata: false
head_epochs: 8
finetune_epochs: 20
finetune_last_n_layers: 40
dropout_rate: 0.30
head_learning_rate: 0.001
finetune_learning_rate: 0.00001
early_stopping_patience: 5
focal_gamma: 2.0
class_balanced_beta: 0.9999
n_bins_ece: 15
bootstrap_reps: 1000
min_subgroup_n: 30
mc_dropout_passes: 20
class_names: [akiec, bcc, bkl, df, mel, nv, vasc]
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  model_dir: models
  result_dir: results
  figure_dir: figures
