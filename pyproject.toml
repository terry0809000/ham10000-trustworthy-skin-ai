[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ham10000-trustworthy-skin-ai"
version = "0.1.0"
description = "Leakage-controlled, calibrated, selective-referral evaluation workflow for HAM10000 skin-lesion AI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tianyi Yu"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "scipy>=1.11",
  "joblib>=1.3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
