name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest numpy pandas scikit-learn scipy matplotlib pillow pyyaml nbformat
      - name: Validate notebook and configuration files
        run: |
          python - <<'PY'
          import nbformat
          from nbformat.validator import validate
          import yaml

          notebook = nbformat.read("notebooks/01_full_colab_workflow.ipynb", as_version=4)
          validate(notebook)

          for path in ["configs/default.yaml", "environment.yml"]:
              with open(path, "r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          PY
      - name: Syntax-check Python sources
        run: |
          python -m py_compile \
            scripts/extract_notebook_code.py \
            scripts/prepare_data.py \
            scripts/full_notebook_pipeline.py \
            src/ham10000_ai/*.py
      - name: Run tests
        run: pytest -q
